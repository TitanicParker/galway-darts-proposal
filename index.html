<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Galway Darts Club Format</title>
</head>
<body>
  <noscript>This explainer needs JavaScript enabled.</noscript>
  <script>
  (() => {
    const SOURCE = './index(20260808-164936).html';

    const ENHANCE = String.raw`
      (() => {
        document.title = 'Galway Darts Club Format';
        const heading = document.querySelector('header h1');
        if (heading) heading.textContent = 'Galway Darts Club Format';

        const slides = [...document.querySelectorAll('.slide')];
        slides.forEach((slide, i) => {
          const card = slide.querySelector('.card');
          if (card) card.dataset.cardNumber = String(i + 1).padStart(2, '0');
        });

        const deck = document.getElementById('deck');
        if (!deck || !slides.length) return;

        const currentIndex = () => Math.max(
          0,
          Math.min(slides.length - 1, Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth)))
        );

        const goTo = (index, behavior = 'smooth') => {
          const i = Math.max(0, Math.min(slides.length - 1, index));
          const card = slides[i].querySelector('.card');
          if (card) card.scrollTop = 0;
          slides[i].scrollIntoView({behavior, inline:'start', block:'nearest'});
        };

        const markActive = () => {
          const i = currentIndex();
          slides.forEach((s, n) => s.classList.toggle('is-active', n === i));
        };
        markActive();
        deck.addEventListener('scroll', () => requestAnimationFrame(markActive), {passive:true});

        /*
          Reliable mobile swipe layer.
          Horizontal gestures change card.
          Vertical gestures remain available for scrolling dense cards.
        */
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartedAt = 0;
        let touchIndex = 0;
        let trackingTouch = false;

        deck.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) {
            trackingTouch = false;
            return;
          }
          const touch = event.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
          touchStartedAt = performance.now();
          touchIndex = currentIndex();
          trackingTouch = true;
        }, {passive:true, capture:true});

        deck.addEventListener('touchend', (event) => {
          if (!trackingTouch || event.changedTouches.length !== 1) return;
          trackingTouch = false;

          const touch = event.changedTouches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          const elapsed = performance.now() - touchStartedAt;
          const horizontal = Math.abs(dx) >= 42 && Math.abs(dx) > Math.abs(dy) * 1.15;

          if (!horizontal || elapsed > 1200) return;
          goTo(touchIndex + (dx < 0 ? 1 : -1));
        }, {passive:true, capture:true});

        window.addEventListener('resize', () => {
          goTo(currentIndex(), 'auto');
        }, {passive:true});
      })();
    `;

    fetch(SOURCE, {cache:'no-store'})
      .then(r => {
        if (!r.ok) throw new Error('Could not load '+SOURCE+' ('+r.status+')');
        return r.text();
      })
      .then(source => {
        const themed = source
          .replace('</head>', '<link rel="stylesheet" href="./theme.css?v=3"></head>')
          .replace('</body>', '<scr'+'ipt>'+ENHANCE+'</scr'+'ipt></body>');
        document.open();
        document.write(themed);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<main style="font-family:Arial;padding:2rem;max-width:800px;margin:auto"><h1>Galway Darts Club Format</h1><p>The source explainer could not be loaded.</p><pre style="white-space:pre-wrap">'+String(err)+'</pre></main>';
      });
  })();
  </script>
</body>
</html>
