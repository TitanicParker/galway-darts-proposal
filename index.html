<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Galway Darts Club Format</title>
</head>
<body>
  <noscript>This explainer needs JavaScript enabled.</noscript>
  <script>
  (() => {
    const SOURCE = './index(20260808-164936).html';

    const THEME = String.raw`
      :root{
        --club-green:#0d4d2d;
        --club-green-2:#17663b;
        --club-green-3:#dfeadd;
        --club-gold:#c99a32;
        --club-gold-2:#e0b85a;
        --club-black:#0b0d0c;
        --club-charcoal:#151917;
        --club-paper:#faf9f2;
        --club-ink:#102017;
        --club-line:#b9c7b9;
        --club-muted:#687268;
        --bg:#0b0d0c !important;
        --card:#faf9f2 !important;
        --ink:#102017 !important;
        --muted:#687268 !important;
        --line:#b9c7b9 !important;
        --accent:#0d4d2d !important;
        --accent-2:#c99a32 !important;
      }

      *{box-sizing:border-box}
      html,body{
        width:100%;
        height:100%;
        min-height:100%;
        margin:0;
        overflow:hidden!important;
      }
      html{background:#0b0d0c}
      body{
        background:
          radial-gradient(circle at 15% 12%,rgba(21,102,59,.20),transparent 24%),
          radial-gradient(circle at 85% 80%,rgba(201,154,50,.10),transparent 28%),
          repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px),
          linear-gradient(180deg,#111512,#080a09 70%);
        color:var(--club-paper)!important;
      }

      .app{
        width:100%;
        height:100vh!important;
        height:100dvh!important;
        min-height:0!important;
        display:grid!important;
        grid-template-rows:auto minmax(0,1fr) auto!important;
        overflow:hidden!important;
        background:transparent!important;
        position:relative;
      }

      .app:before,.app:after{
        content:"";
        position:fixed;
        z-index:20;
        pointer-events:none;
        left:0;right:0;
        height:5px;
        background:linear-gradient(90deg,transparent 2%,var(--club-gold) 14%,var(--club-green-2) 50%,var(--club-gold) 86%,transparent 98%);
      }
      .app:before{top:0}.app:after{bottom:0}

      header{
        min-height:92px!important;
        padding:max(18px,env(safe-area-inset-top)) 26px 16px 126px!important;
        background:linear-gradient(90deg,rgba(13,77,45,.72),rgba(11,13,12,.96) 32%,rgba(11,13,12,.98))!important;
        border-bottom:3px solid var(--club-gold)!important;
        color:#fff!important;
        position:relative!important;
        overflow:hidden;
        align-items:center!important;
        flex:0 0 auto;
      }

      header:before{
        content:"";
        position:absolute;
        width:86px;height:86px;
        left:22px;top:50%;transform:translateY(-50%);
        border-radius:50%;
        border:4px solid #e9e6d6;
        box-shadow:0 0 0 3px #111,0 0 0 6px var(--club-gold);
        background:radial-gradient(circle,#b52620 0 6%,#e7e0c6 6% 13%,#0d4d2d 13% 18%,#111 18% 27%,#e7e0c6 27% 42%,#111 42% 57%,#e7e0c6 57% 72%,#111 72% 100%);
        opacity:.96;
      }

      header:after{
        content:"GALWAY DARTS CLUB • FORMAT PROPOSAL";
        position:absolute;
        left:128px;bottom:10px;
        color:var(--club-gold-2);
        font:800 11px/1 Arial,Helvetica,sans-serif;
        letter-spacing:.16em;
      }

      header h1{
        margin:0 0 18px!important;
        color:#fff!important;
        font-family:Impact,"Arial Narrow",Arial,sans-serif!important;
        font-size:clamp(23px,3.2vw,40px)!important;
        line-height:.95!important;
        letter-spacing:.03em;
        text-transform:uppercase;
        text-shadow:0 2px 0 rgba(0,0,0,.5);
      }

      header .meta{
        color:#f4e3b7!important;
        font-weight:800!important;
        font-size:14px!important;
        background:rgba(201,154,50,.12);
        border:1px solid rgba(224,184,90,.45);
        border-radius:999px;
        padding:7px 11px;
      }

      .deck{
        width:100%!important;
        height:100%!important;
        min-height:0!important;
        display:flex!important;
        align-items:stretch!important;
        overflow-x:auto!important;
        overflow-y:hidden!important;
        scroll-snap-type:x mandatory!important;
        scroll-behavior:smooth;
        overscroll-behavior-x:contain;
        scrollbar-color:var(--club-gold) #111;
        -webkit-overflow-scrolling:touch;
      }

      .slide{
        flex:0 0 100vw!important;
        width:100vw!important;
        min-width:100vw!important;
        height:100%!important;
        min-height:0!important;
        padding:clamp(16px,2.5vw,32px) clamp(14px,3vw,38px) max(36px,env(safe-area-inset-bottom))!important;
        display:block!important;
        place-items:unset!important;
        position:relative;
        overflow-x:hidden!important;
        overflow-y:auto!important;
        overscroll-behavior-y:contain;
        -webkit-overflow-scrolling:touch;
        scroll-snap-align:start!important;
        scroll-snap-stop:always;
        scrollbar-width:thin;
        scrollbar-color:var(--club-gold) rgba(255,255,255,.10);
      }

      .slide::-webkit-scrollbar{width:9px}
      .slide::-webkit-scrollbar-track{background:rgba(255,255,255,.06)}
      .slide::-webkit-scrollbar-thumb{background:var(--club-gold);border-radius:999px;border:2px solid #151917}

      .slide:before{
        content:"";
        position:absolute;
        inset:10px 18px 18px;
        border:1px solid rgba(201,154,50,.17);
        clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
        pointer-events:none;
      }

      .card{
        width:100%!important;
        max-width:1040px!important;
        min-width:0!important;
        margin:0 auto 28px!important;
        border:3px solid var(--club-green)!important;
        border-radius:18px!important;
        padding:clamp(22px,4vw,44px)!important;
        background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(250,249,242,.98)),repeating-linear-gradient(0deg,rgba(13,77,45,.025) 0 1px,transparent 1px 6px)!important;
        color:var(--club-ink)!important;
        box-shadow:0 0 0 3px rgba(201,154,50,.48),0 18px 50px rgba(0,0,0,.42)!important;
        position:relative;
        overflow:hidden;
      }

      .card:before{
        content:"";
        position:absolute;
        left:0;right:0;top:0;
        height:9px;
        background:linear-gradient(90deg,var(--club-green),var(--club-green-2) 68%,var(--club-gold));
      }

      .card:after{
        content:attr(data-card-number);
        position:absolute;
        right:22px;top:16px;
        width:44px;height:44px;
        border-radius:50%;
        display:grid;place-items:center;
        background:var(--club-green);
        color:#fff;
        border:3px solid #fff;
        box-shadow:0 0 0 2px var(--club-gold);
        font:900 17px/1 Arial,sans-serif;
      }

      .kicker{
        display:inline-flex!important;
        align-items:center;
        gap:8px;
        color:#fff!important;
        background:var(--club-green)!important;
        border:1px solid var(--club-green)!important;
        border-radius:999px!important;
        padding:7px 12px!important;
        margin:0 54px 18px 0!important;
        font-size:12px!important;
        font-weight:900!important;
        letter-spacing:.08em!important;
        text-transform:uppercase!important;
      }
      .kicker:before{content:"◆";color:var(--club-gold-2)}

      h2{
        color:var(--club-green)!important;
        font-family:Impact,"Arial Narrow",Arial,sans-serif!important;
        font-size:clamp(30px,5vw,64px)!important;
        line-height:.98!important;
        letter-spacing:.015em!important;
        text-transform:uppercase;
        overflow-wrap:anywhere;
        margin:0 0 22px!important;
      }

      h3{color:var(--club-green)!important}
      p,li{color:#253329!important}
      .lead{color:#314337!important;font-weight:650!important}
      .subtle{color:var(--club-muted)!important}

      .big{
        display:inline-block;
        max-width:100%;
        overflow-wrap:anywhere;
        color:var(--club-gold)!important;
        font-family:Impact,"Arial Narrow",Arial,sans-serif!important;
        text-transform:uppercase;
        text-shadow:0 1px 0 #fff,0 2px 0 rgba(13,77,45,.16);
      }

      .mini,.pod{
        min-width:0;
        background:linear-gradient(180deg,#fff,#f1f5ef)!important;
        border:2px solid #a9bcae!important;
        border-radius:12px!important;
        box-shadow:inset 0 1px 0 #fff,0 3px 0 rgba(13,77,45,.06);
        color:#203126!important;
      }
      .mini strong,.pod b{
        color:var(--club-green)!important;
        font-weight:900!important;
        text-transform:uppercase;
      }

      .grid,.pods{min-width:0}
      .pods{gap:13px!important}
      .pod:nth-child(3){border-color:var(--club-gold)!important}

      .table-wrap{
        max-width:100%;
        overflow-x:auto!important;
        -webkit-overflow-scrolling:touch;
        padding-bottom:3px;
      }

      table{
        border-collapse:separate!important;
        border-spacing:0!important;
        border:2px solid var(--club-green)!important;
        border-radius:12px!important;
        overflow:hidden!important;
        background:#fff!important;
      }
      th{
        background:var(--club-green)!important;
        color:#fff!important;
        text-transform:uppercase;
        letter-spacing:.03em;
        border-bottom:2px solid var(--club-gold)!important;
      }
      td{color:#213027!important;border-bottom:1px solid #d7e0d7!important}
      tbody tr:nth-child(even) td{background:#f3f6ef!important}
      tbody tr:last-child td{border-bottom:0!important}

      .callout{
        border:0!important;
        border-left:7px solid var(--club-gold)!important;
        border-radius:9px!important;
        background:linear-gradient(90deg,#e6efdf,#f8f8f0)!important;
        color:#1d3524!important;
        box-shadow:inset 0 0 0 1px #ccd8c7;
        font-weight:700;
      }
      .callout.warning{border-left-color:#a66c17!important;background:linear-gradient(90deg,#f4e8c8,#fbf8ed)!important}

      .formula{
        max-width:100%;
        overflow-x:auto;
        white-space:normal;
        overflow-wrap:anywhere;
        color:#fff!important;
        background:#101c15!important;
        border:2px solid var(--club-green-2)!important;
        border-left:7px solid var(--club-gold)!important;
        font-weight:700;
      }

      .chain{max-width:100%}
      .chain span{overflow-wrap:anywhere}
      .bar{background:#dce6dc!important;border:1px solid #b3c2b3}
      .bar>span{background:linear-gradient(90deg,var(--club-green),var(--club-green-2),var(--club-gold))!important}

      footer{
        min-height:66px;
        padding:11px 18px max(11px,env(safe-area-inset-bottom))!important;
        background:#0e120f!important;
        border-top:3px solid var(--club-gold)!important;
        color:#fff!important;
        flex:0 0 auto;
      }
      footer button{
        color:#fff!important;
        background:var(--club-green)!important;
        border:2px solid var(--club-gold)!important;
        border-radius:9px!important;
        padding:9px 14px!important;
        font-weight:900!important;
        text-transform:uppercase;
        letter-spacing:.03em;
        box-shadow:0 3px 0 #071f12;
      }
      footer button:hover{background:var(--club-green-2)!important;transform:translateY(-1px)}
      .progress{background:#273027!important;height:8px!important;border:1px solid #394439;min-width:60px}
      .progress>div{background:linear-gradient(90deg,var(--club-green-2),var(--club-gold))!important}
      .chapter{color:#f0cf81!important;font-weight:900!important;text-transform:uppercase;font-size:12px;letter-spacing:.04em}

      .slide.is-active .card{animation:clubCardIn .32s ease-out both}
      @keyframes clubCardIn{from{opacity:.35;transform:translateX(18px)}to{opacity:1;transform:none}}

      @media(max-width:760px){
        header{min-height:72px!important;padding:max(12px,env(safe-area-inset-top)) 12px 10px 78px!important}
        header:before{width:50px;height:50px;left:14px;border-width:3px;box-shadow:0 0 0 2px #111,0 0 0 4px var(--club-gold)}
        header:after{left:78px;bottom:7px;font-size:7px;letter-spacing:.08em}
        header h1{font-size:clamp(19px,6vw,25px)!important;margin-bottom:13px!important}
        .slide{padding:12px 11px max(28px,env(safe-area-inset-bottom))!important}
        .card{padding:20px 16px 24px!important;border-radius:12px!important;margin:0 auto 20px!important;box-shadow:0 0 0 2px rgba(201,154,50,.44),0 10px 28px rgba(0,0,0,.38)!important}
        .card:after{width:34px;height:34px;right:12px;top:13px;font-size:13px;border-width:2px}
        .kicker{margin-right:40px!important;font-size:10px!important;padding:6px 9px!important;margin-bottom:14px!important}
        h2{font-size:clamp(28px,10vw,44px)!important;margin-bottom:16px!important}
        p,li{font-size:15.5px!important;line-height:1.48!important}
        .lead{font-size:18px!important}
        .grid.cols-2,.grid.cols-3,.grid.cols-4,.pods{grid-template-columns:1fr!important}
        .mini,.pod{padding:13px!important}
        footer{min-height:56px!important;padding:7px 8px max(7px,env(safe-area-inset-bottom))!important;gap:7px!important}
        footer .chapter{display:none}
        footer button{padding:8px 9px!important;font-size:11px!important}
        .nav{gap:5px!important}
      }

      @media(max-width:420px){
        header .meta{display:none!important}
        footer{justify-content:space-between!important}
        .progress{max-width:none!important;flex:1 1 70px!important}
        .card{padding-left:14px!important;padding-right:14px!important}
        .compact th,.compact td{font-size:11px!important;padding:4px 5px!important}
      }

      @media(max-height:650px) and (orientation:landscape){
        header{min-height:54px!important;padding:8px 14px 7px 66px!important}
        header:before{width:38px;height:38px;left:14px;border-width:2px;box-shadow:0 0 0 2px #111,0 0 0 3px var(--club-gold)}
        header:after{display:none}
        header h1{font-size:19px!important;margin:0!important}
        header .meta{font-size:11px!important;padding:5px 8px!important}
        .slide{padding-top:10px!important}
        footer{min-height:46px!important;padding:5px 9px!important}
        footer button{padding:6px 9px!important;font-size:10px!important}
        .card{padding-top:18px!important}
      }

      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

      @media print{
        html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#111!important}
        .app{height:auto!important;display:block!important;overflow:visible!important}
        .deck{display:block!important;overflow:visible!important;height:auto!important}
        .slide{width:auto!important;min-width:0!important;height:auto!important;overflow:visible!important;page-break-after:always!important}
        .slide:before,.app:before,.app:after{display:none}
        .card{box-shadow:none!important}
      }
    `;

    const ENHANCE = String.raw`
      (() => {
        document.title = 'Galway Darts Club Format';
        const heading = document.querySelector('header h1');
        if (heading) heading.textContent = 'Galway Darts Club Format';

        const slides = [...document.querySelectorAll('.slide')];
        slides.forEach((slide, i) => {
          const card = slide.querySelector('.card');
          if (card) card.dataset.cardNumber = String(i + 1).padStart(2, '0');
        });

        const deck = document.getElementById('deck');
        const markActive = () => {
          if (!deck || !slides.length) return;
          const i = Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth))));
          slides.forEach((s, n) => s.classList.toggle('is-active', n === i));
        };
        markActive();
        deck?.addEventListener('scroll', () => requestAnimationFrame(markActive), {passive:true});

        window.addEventListener('resize', () => {
          const i = Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth))));
          slides[i]?.scrollIntoView({behavior:'auto',inline:'start',block:'nearest'});
        }, {passive:true});
      })();
    `;

    fetch(SOURCE, {cache:'no-store'})
      .then(r => {
        if (!r.ok) throw new Error('Could not load '+SOURCE+' ('+r.status+')');
        return r.text();
      })
      .then(source => {
        const themed = source
          .replace('</head>', `<style id="club-infographic-theme">${THEME}</style></head>`)
          .replace('</body>', '<scr'+'ipt>'+ENHANCE+'</scr'+'ipt></body>');
        document.open();
        document.write(themed);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<main style="font-family:Arial;padding:2rem;max-width:800px;margin:auto"><h1>Galway Darts Club Format</h1><p>The source explainer could not be loaded.</p><pre style="white-space:pre-wrap">'+String(err)+'</pre></main>';
      });
  })();
  </script>
