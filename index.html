  <noscript>This explainer needs JavaScript enabled.</noscript>
  <script>

      .kicker{

        border:1px solid var(--club-green)!important;border-radius:999px!important;padding:7px 12px!important;margin:0 54px 18px 0!important;

      }
      .kicker:before{content:"◆";color:var(--club-gold-2)}
      h2{
        color:var(--club-green)!important;font-family:Impact,"Arial Narrow",Arial,sans-serif!important;font-size:clamp(30px,5vw,64px)!important;

      .big{display:inline-block;max-width:100%;overflow-wrap:anywhere;color:var(--club-gold)!important;font-family:Impact,"Arial Narrow",Arial,sans-serif!important;text-transform:uppercase;text-shadow:0 1px 0 #fff,0 2px 0 rgba(13,77,45,.16)}

      }
      .mini strong,.pod b{color:var(--club-green)!important;font-weight:900!important;text-transform:uppercase}
      .grid,.pods{min-width:0}.pods{gap:13px!important}.pod:nth-child(3){border-color:var(--club-gold)!important}

      .table-wrap{max-width:100%;overflow-x:auto!important;-webkit-overflow-scrolling:touch;padding-bottom:3px}

      td{color:#213027!important;border-bottom:1px solid #d7e0d7!important}tbody tr:nth-child(even) td{background:#f3f6ef!important}tbody tr:last-child td{border-bottom:0!important}

      .callout{border:0!important;border-left:7px solid var(--club-gold)!important;border-radius:9px!important;background:linear-gradient(90deg,#e6efdf,#f8f8f0)!important;color:#1d3524!important;box-shadow:inset 0 0 0 1px #ccd8c7;font-weight:700}

        color:#fff!important;background:var(--club-green)!important;border:2px solid var(--club-gold)!important;border-radius:9px!important;

      }
      footer button:hover{background:var(--club-green-2)!important;transform:translateY(-1px)}
      .progress{background:#273027!important;height:8px!important;border:1px solid #394439;min-width:60px}.progress>div{background:linear-gradient(90deg,var(--club-green-2),var(--club-gold))!important}
      .chapter{color:#f0cf81!important;font-weight:900!important;text-transform:uppercase;font-size:12px;letter-spacing:.04em}

      .slide.is-active .card{animation:clubCardIn .32s ease-out both}
      @keyframes clubCardIn{from{opacity:.35;transform:translateX(18px)}to{opacity:1;transform:none}}

      /* PHONE-FIRST STORY MODE: one card occupies one screen. */

        .app{grid-template-rows:auto minmax(0,1fr) auto!important}

        header{
          min-height:50px!important;
          height:auto!important;
          padding:max(8px,env(safe-area-inset-top)) 10px 7px 56px!important;
          border-bottom-width:2px!important;
        }
        header:before{
          width:34px;height:34px;left:11px;border-width:2px;
          box-shadow:0 0 0 1px #111,0 0 0 3px var(--club-gold);
        }
        header:after{display:none!important}
        header h1{
          font-size:clamp(16px,5vw,20px)!important;
          line-height:1!important;
          margin:0!important;
          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;
        }
        header .meta{
          font-size:11px!important;
          padding:4px 7px!important;
          margin-left:8px;
          flex:0 0 auto;
        }

        .deck{height:100%!important;touch-action:pan-x pan-y}
        .slide{
          height:100%!important;
          min-height:0!important;
          padding:7px!important;
          overflow:hidden!important;
          scrollbar-width:none!important;
        }
        .slide::-webkit-scrollbar{display:none!important}
        .slide:before{inset:4px!important;opacity:.42}

        .card{
          width:100%!important;
          height:100%!important;
          min-height:0!important;
          max-height:100%!important;
          margin:0!important;
          padding:14px 13px 16px!important;
          border-width:2px!important;
          border-radius:11px!important;
          box-shadow:0 0 0 1px rgba(201,154,50,.52),0 7px 18px rgba(0,0,0,.38)!important;
          overflow-y:auto!important;
          overflow-x:hidden!important;
          overscroll-behavior:contain;
          -webkit-overflow-scrolling:touch;
          scrollbar-width:none;
        }
        .card::-webkit-scrollbar{display:none}
        .card:before{height:6px}
        .card:after{
          width:29px;height:29px;right:10px;top:10px;font-size:11px;border-width:2px;
          box-shadow:0 0 0 1px var(--club-gold);
        }

        .kicker{
          margin:0 34px 9px 0!important;
          padding:4px 7px!important;
          font-size:8.5px!important;
          line-height:1.15!important;
          letter-spacing:.055em!important;
        }
        h2{
          font-size:clamp(25px,8vw,35px)!important;
          line-height:.96!important;
          margin-bottom:10px!important;
        }
        h3{margin:12px 0 5px!important}
        p,li{font-size:14px!important;line-height:1.38!important}
        p{margin:8px 0!important}
        ul,ol{margin:7px 0 7px!important;padding-left:20px!important}
        li{margin:3px 0!important}
        .lead{font-size:16px!important;line-height:1.35!important}
        .big{font-size:clamp(34px,12vw,54px)!important}

        /* Use phone width efficiently instead of stacking every mini-card vertically. */
        .grid{gap:7px!important}
        .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
        .grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
        .pods{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}
        .mini,.pod{padding:9px!important;border-width:1.5px!important;border-radius:8px!important;font-size:13px!important;line-height:1.3!important}
        .mini strong,.pod b{font-size:12px!important;margin-bottom:2px!important}

        .chain{gap:4px!important;margin:9px 0!important}
        .chain span{padding:6px 7px!important;font-size:11px!important;border-radius:6px!important}
        .chain i{font-size:15px!important}
        .callout{margin:9px 0!important;padding:8px 9px!important;border-left-width:5px!important;font-size:13px!important;line-height:1.35!important}
        .formula{padding:8px!important;font-size:12px!important;line-height:1.35!important}

        table{margin-top:7px!important;font-size:11px!important}
        th,td{padding:4px 5px!important}
        .compact th,.compact td{font-size:10px!important;padding:2.5px 4px!important;line-height:1.15!important}
        .table-wrap{max-height:none!important;overflow-x:auto!important;overflow-y:visible!important}

        .scale-row{grid-template-columns:62px 1fr!important;gap:7px!important;margin:5px 0!important}
        .scale-row strong{font-size:12px!important}
        .bar{height:22px!important}
        .bar-label{font-size:10px!important;padding-left:6px!important}

        footer{
          min-height:44px!important;
          padding:5px 7px max(5px,env(safe-area-inset-bottom))!important;
          gap:6px!important;
          border-top-width:2px!important;
        }
        footer .chapter{display:none!important}
        footer button{
          min-height:34px!important;
          padding:6px 8px!important;
          font-size:10px!important;
          line-height:1!important;
          border-width:1.5px!important;
          box-shadow:none!important;
        }
        .nav{gap:4px!important;flex:0 0 auto}
        .progress{height:6px!important;max-width:none!important;flex:1 1 auto!important;min-width:40px!important}

      @media(max-width:390px){
        header .meta{display:none!important}
        header{padding-right:8px!important}
        .card{padding:13px 11px 14px!important}
        h2{font-size:clamp(23px,8vw,31px)!important}
        p,li{font-size:13.5px!important}
        .lead{font-size:15px!important}
        .mini,.pod{padding:8px!important;font-size:12px!important}
        footer button{padding:6px 7px!important}

      @media(max-height:650px) and (orientation:landscape){
        header{min-height:38px!important;padding:5px 8px 5px 46px!important}
        header:before{width:27px;height:27px;left:9px;border-width:1.5px;box-shadow:0 0 0 1px #111,0 0 0 2px var(--club-gold)}
        header h1{font-size:16px!important}
        header .meta{font-size:9px!important;padding:3px 6px!important}
        .slide{padding:5px!important}

      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

      @media print{
        html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#111!important}

        .slide{width:auto!important;min-width:0!important;height:auto!important;overflow:visible!important;page-break-after:always!important}
        .slide:before,.app:before,.app:after{display:none}
        .card{height:auto!important;overflow:visible!important;box-shadow:none!important}
      }
    `;

    const ENHANCE = String.raw`
      (() => {
        document.title = 'Galway Darts Club Format';
        const heading = document.querySelector('header h1');
        if (heading) heading.textContent = 'Galway Darts Club Format';

        const slides = [...document.querySelectorAll('.slide')];
        slides.forEach((slide, i) => {
          const card = slide.querySelector('.card');
          if (card) card.dataset.cardNumber = String(i + 1).padStart(2, '0');
        });

        const deck = document.getElementById('deck');
        const markActive = () => {
          if (!deck || !slides.length) return;
          const i = Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth))));
          slides.forEach((s, n) => s.classList.toggle('is-active', n === i));
        };
        markActive();
        deck?.addEventListener('scroll', () => requestAnimationFrame(markActive), {passive:true});

        window.addEventListener('resize', () => {
          if (!deck || !slides.length) return;
          const i = Math.max(0, Math.min(slides.length - 1, Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth))));
          slides[i]?.scrollIntoView({behavior:'auto',inline:'start',block:'nearest'});
        }, {passive:true});
      })();
    `;

    fetch(SOURCE, {cache:'no-store'})
      .then(r => {
        if (!r.ok) throw new Error('Could not load '+SOURCE+' ('+r.status+')');
        return r.text();
      })
      .then(source => {
        const themed = source
          .replace('</head>', `<style id="club-infographic-theme">${THEME}</style></head>`)
          .replace('</body>', '<scr'+'ipt>'+ENHANCE+'</scr'+'ipt></body>');
        document.open();
        document.write(themed);
        document.close();
      })
      .catch(err => {
        document.body.innerHTML = '<main style="font-family:Arial;padding:2rem;max-width:800px;margin:auto"><h1>Galway Darts Club Format</h1><p>The source explainer could not be loaded.</p><pre style="white-space:pre-wrap">'+String(err)+'</pre></main>';
      });
  })();
  </script>
